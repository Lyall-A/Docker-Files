services:
  pterodactyl-database:
    image: mariadb:11
    container_name: pterodactyl-database
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ../../Volumes/pterodactyl/database:/var/lib/mysql
    environment:
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pterodactyl
      MYSQL_ROOT_PASSWORD: pterodactyl
      MYSQL_DATABASE: pterodactyl
  pterodactyl-cache:
    image: redis:alpine
    container_name: pterodactyl-cache
    restart: unless-stopped
  pterodactyl-panel:
    image: ghcr.io/pterodactyl/panel
    container_name: pterodactyl-panel
    restart: unless-stopped
    ports:
      - 5700:80
      - 5701:443
    volumes:
      - ../../Volumes/pterodactyl/panel/var:/app/var
      - ../../Volumes/pterodactyl/panel/nginx:/app/nginx/http.d
      - ../../Volumes/pterodactyl/panel/certs:/app/letsencrypt
      - ../../Volumes/pterodactyl/panel/logs:/app/storage/logs
    environment:
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: false
      HASHIDS_LENGTH: 8
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: pterodactyl-cache
      DB_HOST: pterodactyl-database
      DB_PORT: 3306
      DB_DATABASE: pterodactyl
      DB_USERNAME: pterodactyl
      DB_PASSWORD: pterodactyl
  pterodactyl-wings:
    image: ghcr.io/pterodactyl/wings
    container_name: pterodactyl-wings
    restart: unless-stopped
    networks:
      - pterodactyl-wings
    ports:
      - 5702:5702
      - 5703:5703
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /run/wings:/run/wings
      - /var/lib/pterodactyl:/var/lib/pterodactyl # wings sends this path to docker, so it will fail if custom paths are used
      - /tmp/pterodactyl:/tmp/pterodactyl # wings sends this path to docker, so it will fail if custom paths are used
      - ../../Volumes/pterodactyl/wings/etc:/etc/pterodactyl
      - ../../Volumes/pterodactyl/wings/logs:/var/log/pterodactyl
      - ../../Volumes/pterodactyl/wings/certs:/etc/ssl/certs
    environment:
      WINGS_USERNAME: pterodactyl
networks:
  pterodactyl-wings:
    name: pterodactyl_nw # wings uses this name by default, if the network doesnt already exist it will attempt to create it using the subnet 172.18.0.0/16, which may already be taken, causing an error
    ipam:
      config:
        - subnet: 172.50.0.0/16
